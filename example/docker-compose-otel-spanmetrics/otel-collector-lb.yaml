receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

exporters:
  # routing_key=service : 동일 서비스의 모든 Span이 동일한 Spanmetrics Collector로 전달됨
  loadbalancing/spanmetrics:
    routing_key: service
    protocol:
      otlp:
        tls:
          insecure: true
    resolver:
      static:
        hostnames:
          - otel-collector-spanmetrics:4317

  # routing_key=traceID : 동일 TraceID의 모든 Span이 동일한 Tailsampling Collector로 전달됨
  loadbalancing/tailsampling:
    routing_key: traceID
    protocol:
      otlp:
        tls:
          insecure: true
    resolver:
      static:
        hostnames:
          - otel-collector-tailsampling:4317

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [loadbalancing/spanmetrics, loadbalancing/tailsampling]
