services:

  # Tempo runs as user 10001, and docker compose creates the volume as root.
  # As such, we need to chown the volume in order for Tempo to start correctly.
  init:
    image: &tempoImage grafana/tempo:2.7.1
    user: root
    entrypoint:
      - "chown"
      - "10001:10001"
      - "/var/tempo"
    volumes:
      - ./tempo-data:/var/tempo

  tempo:
    image: *tempoImage
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
      - ./tempo-data:/var/tempo
    ports:
      - "3200:3200"
    depends_on:
      - init

  springboot:
    image: kyeongjundev/springboot:39e2e243b5ddd14f47c35a91f00c068aef13b6ab
    environment:
      - OTEL_EXPORTER_OTLP_TRACES_PROTOCOL=grpc
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector-lb:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_LOGS_EXPORTER=none
      - OTEL_METRICS_EXPORTER=none
      - OTEL_SERVICE_NAME=demo
      - OTEL_TRACES_EXPORTER=otlp
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      - otel-collector-lb

  # Layer #1 : Load Balancing Exporter
  # - routing_key=service  → otel-collector-spanmetrics
  # - routing_key=traceID  → otel-collector-tailsampling
  otel-collector-lb:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: [ "--config=/etc/otel-collector-lb.yaml" ]
    volumes:
      - ./otel-collector-lb.yaml:/etc/otel-collector-lb.yaml
    ports:
      - "4317:4317"
    depends_on:
      - otel-collector-spanmetrics
      - otel-collector-tailsampling

  # Layer #2 : Spanmetrics Connector
  # Generates RED metrics (rate/error/duration) per service from spans
  otel-collector-spanmetrics:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: [ "--config=/etc/otel-collector-spanmetrics.yaml" ]
    volumes:
      - ./otel-collector-spanmetrics.yaml:/etc/otel-collector-spanmetrics.yaml
    depends_on:
      - prometheus

  # Layer #2 : Tail Sampling Processor
  # Applies tail sampling decisions on complete traces before forwarding to Tempo
  otel-collector-tailsampling:
    image: otel/opentelemetry-collector-contrib:0.119.0
    command: [ "--config=/etc/otel-collector-tailsampling.yaml" ]
    volumes:
      - ./otel-collector-tailsampling.yaml:/etc/otel-collector-tailsampling.yaml
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus.yaml
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yaml:/etc/prometheus.yaml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.0.0
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
